# Copy this file to .github/workflows/preview.yml in the NEW
# krishansironline-preview-v2 repository.
# It deploys only to that repository's GitHub Pages site.
# It never publishes to the production krishansir.online site.

name: Build and Deploy Isolated Preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Main repository branch or tag to preview"
        required: true
        default: "main"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate selected source and build Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout Preview repository
        uses: actions/checkout@v4

      - name: Checkout selected source from Main repository
        uses: actions/checkout@v4
        with:
          repository: tcoe96096/krishansironline
          ref: ${{ inputs.source_ref }}
          path: source

      - name: Record exact source commit
        working-directory: source
        run: |
          git rev-parse HEAD | tee PREVIEW_SOURCE_COMMIT.txt
          printf '%s\n' "${{ inputs.source_ref }}" > PREVIEW_SOURCE_REF.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: source
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        working-directory: source
        run: npm run lint

      - name: Build Vite site for isolated GitHub Pages path
        working-directory: source
        run: npm run build -- --base=/krishansironline-preview-v2/

      - name: Verify generated Preview entry pages
        working-directory: source
        run: |
          set -eu
          test -s dist/index.html
          test -s dist/admin/index.html
          test -s dist/classes/index.html
          test -s dist/online-tests/index.html
          test -s dist/study-materials/index.html
          test -s dist/results/index.html
          test -s dist/constitution/index.html
          test -s dist/current-affairs/index.html
          test -s dist/about/index.html
          test -s dist/contact/index.html
          echo "All required Preview entry pages exist."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

  deploy:
    name: Deploy Preview repository only
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Preview to this repository's GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
