name: KSOL synthetic cloud Auth and Storage recovery (no live data)
on:
  pull_request:
    paths:
      - 'scripts/recovery/restore-storage-to-local-supabase.mjs'
      - 'scripts/recovery/synthetic-cloud-service-rehearsal.mjs'
      - '.github/workflows/ksol-synthetic-cloud-service-rehearsal.yml'
      - 'scripts/results/package-result-edge-20261128.mjs'
      - 'scripts/results/package-edge-fonts-20261128.mjs'
      - 'tests/fixtures/result-edge-runtime-synthetic-index.ts'
      - 'docs/results/result-generation-edge-*-CANDIDATE-DO-NOT-DEPLOY.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-service-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v3
        with:
          version: '2.20.3'
      - name: Prepare disposable synthetic stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone fonts-noto-core
          mkdir -m 700 "$RUNNER_TEMP/ksol-synthetic-stack"
          cd "$RUNNER_TEMP/ksol-synthetic-stack"
          supabase init
          mkdir -p supabase/functions
          latin="$(fc-match -f '%{file}' 'Noto Sans')"
          hindi="$(fc-match -f '%{file}' 'Noto Sans Devanagari')"
          cd "$GITHUB_WORKSPACE"
          node scripts/results/package-edge-fonts-20261128.mjs "$latin" "$hindi" "$(sha256sum "$latin" | cut -d ' ' -f1)" "$(sha256sum "$hindi" | cut -d ' ' -f1)" "$RUNNER_TEMP/ksol-synthetic-fonts.ts"
          node scripts/results/package-result-edge-20261128.mjs "$RUNNER_TEMP/ksol-synthetic-fonts.ts" "$RUNNER_TEMP/ksol-synthetic-stack/supabase/functions/ksol-result-pdf-generate"
          cp -a "$RUNNER_TEMP/ksol-synthetic-stack/supabase/functions/ksol-result-pdf-generate" "$RUNNER_TEMP/ksol-synthetic-stack/supabase/functions/ksol-synthetic-result-generation"
          cp tests/fixtures/result-edge-runtime-synthetic-index.ts "$RUNNER_TEMP/ksol-synthetic-stack/supabase/functions/ksol-synthetic-result-generation/index.ts"
          cd "$RUNNER_TEMP/ksol-synthetic-stack"
          # No project link, existing migrations, production credentials or network calls to live projects.
          supabase start > "$RUNNER_TEMP/ksol-synthetic-start.log" 2>&1 || { echo 'Synthetic Supabase startup failed'; exit 2; }
      - name: Restore encrypted synthetic fixture and verify real local services
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/ksol-synthetic-stack"
          status="$(supabase status -o env 2>/dev/null)"
          export KSOL_LOCAL_STORAGE_SERVICE_KEY="$(printf '%s\n' "$status" | sed -n 's/^SERVICE_ROLE_KEY="\([^"]*\)"$/\1/p')"
          export KSOL_LOCAL_ANON_KEY="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p')"
          unset status
          test -n "$KSOL_LOCAL_STORAGE_SERVICE_KEY"
          test -n "$KSOL_LOCAL_ANON_KEY"
          export RCLONE_CONFIG="$RUNNER_TEMP/ksol-synthetic-rclone.conf"
          mkdir -m 700 "$RUNNER_TEMP/ksol-synthetic-encrypted"
          touch "$RCLONE_CONFIG"
          chmod 600 "$RCLONE_CONFIG"
          rclone config create ksolsyntheticlocal local > /dev/null
          rclone config create ksolcrypt crypt remote "ksolsyntheticlocal:$RUNNER_TEMP/ksol-synthetic-encrypted" password "$(openssl rand -hex 32)" password2 "$(openssl rand -hex 32)" > /dev/null
          export KSOL_SYNTHETIC_REHEARSAL=true
          echo "SYNTHETIC_ENCRYPTED_REMOTE_READY"
          cd "$GITHUB_WORKSPACE"
          node scripts/recovery/synthetic-cloud-service-rehearsal.mjs
      - name: Verify packaged disabled Result function on actual local Supabase Edge
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/ksol-synthetic-stack"
          status="$(supabase status -o env 2>/dev/null)"
          anon="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p')"
          unset status
          test -n "$anon"
          url='http://127.0.0.1:54321/functions/v1/ksol-result-pdf-generate'
          response="$RUNNER_TEMP/ksol-synthetic-edge-response.json"
          for attempt in $(seq 1 8); do
            code="$(curl -sS --max-time 20 -o "$response" -w '%{http_code}' -X POST "$url" -H "Authorization: Bearer $anon" -H 'Origin: https://krishansir.online' -H 'Content-Type: application/json' -d '{}' || true)"
            if test "$code" = 423; then break; fi
            sleep 3
          done
          test "$code" = 423 || { echo "Synthetic Edge function did not return disabled status (HTTP $code)"; exit 2; }
          python3 - "$response" <<'PY'
          import json, sys
          body=json.load(open(sys.argv[1]))
          assert isinstance(body.get('error'),str) and body['error']
          PY
          rm -f "$response"
          echo SYNTHETIC_SUPABASE_EDGE_DISABLED_RUNTIME_VERIFIED
      - name: Generate actual synthetic PDF inside local Edge worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/ksol-synthetic-stack"
          status="$(supabase status -o env 2>/dev/null)"
          anon="$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p')"
          unset status
          test -n "$anon"
          url='http://127.0.0.1:54321/functions/v1/ksol-synthetic-result-generation'
          response="$RUNNER_TEMP/ksol-synthetic-edge-response.json"
          code="$(curl -sS --max-time 60 -o "$response" -w '%{http_code}' -X POST "$url" -H "Authorization: Bearer $anon" -H 'Origin: https://krishansir.online' -H 'Content-Type: application/json' -d '{"attemptId":"00000000-0000-0000-0000-000000000010","expectedVersion":1,"requestKey":"00000000-0000-0000-0000-000000000011"}')"
          test "$code" = 200 || { echo "Synthetic Edge generation failed (HTTP $code)"; exit 2; }
          python3 - "$response" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={'state':'approved','version':1}
          PY
          rm -f "$response"
          echo SYNTHETIC_EDGE_PDF_GENERATION_AND_MOCK_APPROVAL_VERIFIED
      - name: Dispose of synthetic stack
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/ksol-synthetic-stack"; then
            cd "$RUNNER_TEMP/ksol-synthetic-stack"
            supabase stop --no-backup > /dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/ksol-synthetic-rclone.conf" "$RUNNER_TEMP/ksol-synthetic-start.log" "$RUNNER_TEMP/ksol-synthetic-fonts.ts" "$RUNNER_TEMP/ksol-synthetic-edge-response.json"
