name: Isolated Teacher Core Beta validation (no deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - name: Compile isolated Teacher Core Beta only
        env:
          VITE_SUPABASE_URL: https://teacher-test.supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-key
          VITE_TEACHER_BETA_ENABLED: 'true'
          VITE_TEACHER_ADVANCED_ENABLED: 'false'
          VITE_TEACHER_RESULT_ANALYTICS_ENABLED: 'false'
          VITE_TEACHER_RESUME_ENABLED: 'false'
        run: npm run build:teacher-beta
      - name: Core validation and API contract tests
        run: node --import tsx --test tests/teacherManagementValidation.test.ts tests/teacherManagementClient.test.ts
      - name: Verify isolated release excludes unrelated modules and backend activation
        run: |
          test -f teacher-beta-dist/index.html
          test ! -d supabase/migrations
          test ! -d supabase/functions/teacher-resume
          test ! -f src/components/ResultsPortal.tsx || exit 1
          test ! -f src/components/AdminWebsiteStudioHub.tsx || exit 1
          test ! -f src/components/SmartResultReportCard.tsx || exit 1
          ! grep -rE 'teacher_management_v2.*\.sql' supabase/migrations 2>/dev/null
