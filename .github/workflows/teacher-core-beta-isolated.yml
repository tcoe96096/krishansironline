name: Teacher Core Beta isolated checks - no deployment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - name: TypeScript validation
        run: npm run lint
      - name: Teacher Core Beta unit tests
        run: node --import tsx --test tests/teacherBetaFlags.test.ts tests/teacherManagementClient.test.ts tests/teacherManagementValidation.test.ts tests/teacherScopeTransition.test.ts
      - name: Main website build, no deployment
        run: npm run build
      - name: Build isolated core portal for MOCK browser tests only
        env:
          VITE_SUPABASE_URL: https://teacher-test.supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-key
          VITE_TEACHER_BETA_ENABLED: 'true'
          VITE_TEACHER_ADVANCED_ENABLED: 'false'
          VITE_TEACHER_RESULT_ANALYTICS_ENABLED: 'false'
          VITE_TEACHER_RESUME_ENABLED: 'false'
        run: npx vite build --config vite.teacher-beta.config.ts
      - name: Ensure routes exist and optional resume is absent
        run: |
          test -f teacher-beta-dist/index.html
          test -f teacher-beta-dist/staff-workspace/index.html
          test -f teacher-beta-dist/admin/index.html
          ! grep -R -l 'teacher-resume' teacher-beta-dist/assets
      - run: npm install --no-save --legacy-peer-deps playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local preview (mock API only)
        run: |
          npx vite preview --config vite.teacher-beta.config.ts --port 4177 --host 127.0.0.1 > /tmp/teacher-core.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4177/teacher-beta/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser contract tests (synthetic users, no real database)
        env:
          TEACHER_TEST_BASE_URL: http://127.0.0.1:4177/teacher-beta
          TEACHER_TEST_PORTAL: 'true'
        run: node scripts/teacher-management-smoke.mjs
