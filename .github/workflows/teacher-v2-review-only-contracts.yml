name: Teacher v2 review-only contract checks
on:
  push:
    branches:
      - 'feature/teacher-v2-role-acceptance-matrix-20261120'
    paths:
      - 'tests/teacher/teacher-v2-*.test.mjs'
      - 'tests/teacher-v2-private-media*.test.mjs'
      - 'docs/teacher/teacher-v2-*.md'
      - 'docs/teacher/teacher-v2-preview-catalog-readonly.sql'
      - '.github/workflows/teacher-v2-review-only-contracts.yml'
  pull_request:
    paths:
      - 'tests/teacher/teacher-v2-*.test.mjs'
      - 'tests/teacher-v2-private-media*.test.mjs'
      - 'docs/teacher/teacher-v2-*.md'
      - 'docs/teacher/teacher-v2-preview-catalog-readonly.sql'
      - '.github/workflows/teacher-v2-review-only-contracts.yml'
permissions:
  contents: read
jobs:
  offline-review:
    name: Offline contract integrity (no Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute review-only teacher contracts
        run: |
          node --test tests/teacher/teacher-v2-*.test.mjs tests/teacher-v2-private-media*.test.mjs
