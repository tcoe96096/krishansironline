name: Smart Result System unit tests (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/ResultsPortal.tsx'
      - 'src/components/SmartResultReportCard.tsx'
      - 'src/components/AdminTestResults.tsx'
      - 'src/components/AdminStaffPermissions.tsx'
      - 'src/services/resultMetrics.ts'
      - 'src/services/resultMetrics.test.ts'
      - 'src/services/reportCardTemplate.ts'
      - 'src/services/reportCardTemplate.test.ts'
      - 'src/services/learningLinks.ts'
      - 'src/services/learningLinks.test.ts'
      - 'src/services/staffGrantPolicy.ts'
      - 'src/services/staffGrantPolicy.test.ts'
      - 'src/components/StaffRoleMatrix.tsx'
      - 'src/components/StaffLearningWorkspace.tsx'
      - 'src/components/PublishedMaterialLibrary.tsx'
      - 'src/components/AdminMaterialReview.tsx'
      - 'src/App.tsx'
      - 'src/components/AdminStudyMaterialControl.tsx'
      - 'src/components/StudyMaterialsView.tsx'
      - 'src/components/AdminDashboard.tsx'
      - 'src/components/SmartResultReportCard.test.tsx'
      - 'src/components/AdminTestResults.test.tsx'
      - 'src/services/attemptDisplayStatus.ts'
      - 'src/services/attemptDisplayStatus.test.ts'
      - 'docs/proposed-migrations/**'
      - '.github/workflows/result-system-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-unit-tests:
    name: Verify result formatting and data safeguards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run result unit tests
        run: node --import tsx --test src/services/resultMetrics.test.ts src/components/SmartResultReportCard.test.tsx src/services/attemptDisplayStatus.test.ts src/services/learningLinks.test.ts src/services/staffGrantPolicy.test.ts src/components/AdminTestResults.test.tsx src/services/reportCardTemplate.test.ts
      - name: Verify TypeScript
        run: npm run lint
      - name: Verify production-style build only
        run: npm run build
