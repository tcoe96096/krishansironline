name: Teacher v2 isolated checks
on:
  pull_request:
    paths:
      - 'src/lib/teacherSnapshotValidation.ts'
      - 'src/services/teacherManagement.ts'
      - 'src/lib/teacherManagementValidation.ts'
      - 'tests/teacherSnapshotIdentity.test.ts'
      - '.github/workflows/teacher-v2-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-v2-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Teacher identity regression tests
        run: npx tsx --test tests/teacherSnapshotIdentity.test.ts
