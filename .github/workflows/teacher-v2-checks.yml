name: Teacher v2 isolated checks
on:
  pull_request:
    paths:
      - 'src/lib/teacherSnapshotValidation.ts'
      - 'src/services/teacherManagement.ts'
      - 'src/lib/teacherManagementValidation.ts'
      - 'tests/teacherSnapshotIdentity.test.ts'
      - 'tests/teacherManagementClient.test.ts'
      - 'tests/teacherManagementValidation.test.ts'
      - '.github/workflows/teacher-v2-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-v2-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This repository currently has no npm lockfile; do not use npm ci/cache.
      - name: Install dependencies without writing a lockfile
        run: npm install --no-package-lock --ignore-scripts
      - name: Typecheck
        run: npm run lint
      - name: Build website bundle
        run: npm run build
      - name: Teacher v2 regression tests
        run: npx tsx --test tests/teacherSnapshotIdentity.test.ts tests/teacherManagementClient.test.ts tests/teacherManagementValidation.test.ts
