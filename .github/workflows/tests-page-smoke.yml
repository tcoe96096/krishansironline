name: Tests Page focused mock browser check
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/OnlineTestEngine.tsx'
      - 'src/App.tsx'
      - '.github/workflows/tests-page-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://catalogue-fixture.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm install --no-save --legacy-peer-deps playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start isolated preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/catalogue-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/online-tests/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/catalogue-preview.log
          exit 1
      - name: Check desktop and mobile catalogue (synthetic API only)
        run: |
          cat > .catalogue-smoke.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const base = 'http://127.0.0.1:4173';
          const fixtures = Array.from({length: 14}, (_, i) => ({
            id: 'fixture-' + i,
            title: {en: 'Fixture test ' + i, hi: 'परीक्षण ' + i},
            class_level: i === 13 ? '10' : '9',
            subject: i === 13 ? 'Geography' : 'History',
            chapter: i === 13 ? 'Resources' : 'Chapter ' + i,
            duration_minutes: 30, total_marks: 1, attempt_limit: 2,
            questions: [{id:'q1', question:{en:'Fixture question',hi:'प्रश्न'}, options:{en:['A','B','C','D'],hi:['क','ख','ग','घ']}, chapter:'Fixture',marks:1,type:'mcq'}]
          }));
          try {
            for (const width of [1440,390]) {
              const context = await browser.newContext({viewport:{width,height:900},serviceWorkers:'block'});
              let failCatalogue = false;
              let starts = 0;
              await context.addInitScript(() => localStorage.setItem('krishan_portal_lang','en'));
              await context.route('**/*', async route => {
                const url = new URL(route.request().url());
                if (url.origin === base) return route.continue();
                if (url.hostname !== 'catalogue-fixture.invalid') return route.abort();
                const headers = {'access-control-allow-origin':'*','access-control-allow-headers':'*','access-control-allow-methods':'GET,POST,OPTIONS','content-type':'application/json'};
                if (route.request().method() === 'OPTIONS') return route.fulfill({status:204,headers});
                if (url.pathname.endsWith('/rpc/start_test_attempt')) { starts++; return route.fulfill({status:403,headers,body:'{}'}); }
                const catalogue = url.pathname === '/rest/v1/tests';
                return route.fulfill({status:catalogue && failCatalogue ? 503 : 200,headers,body:JSON.stringify(catalogue ? (failCatalogue ? {message:'Fixture unavailable'} : fixtures) : [])});
              });
              const page = await context.newPage();
              await page.goto(base + '/online-tests/');
              const scope = page.locator('#tests');
              await scope.getByRole('heading',{name:'Online Test Centre',exact:true}).waitFor();
              await page.getByRole('navigation',{name:'Breadcrumb'}).getByRole('button',{name:'Home',exact:true}).waitFor();
              await page.getByRole('button',{name:'Back to Home',exact:true}).waitFor();
              assert.equal(await scope.getByText('KRISHAN SIR ONLINE LEARNING',{exact:true}).count(),0,'Repeated branding removed');
              assert.equal(await scope.getByText('Browse published tests. Sign in to attempt tests for your class.',{exact:true}).count(),0,'Repeated subtitle removed');
              if (width < 480) {
                const nav = page.getByRole('navigation',{name:'Main navigation'});
                for (const name of ['Toggle navigation','Search','Teacher Management','Student Login']) {
                  const control = nav.getByRole('button',{name,exact:true});
                  await control.waitFor();
                  const bounds = await control.boundingBox();
                  assert.ok(bounds && bounds.x >= -1 && bounds.x+bounds.width <= width+1, name+' must fit within the mobile viewport');
                }
              }
              assert.equal(await page.getByRole('heading',{name:'Online Tests & Practice Portal',exact:true}).count(),0,'Duplicate banner heading removed');
              assert.equal(await page.getByText('Attempt available online tests and practice questions with the dedicated test engine.',{exact:true}).count(),0,'Duplicate subtitle removed');
              assert.equal(await scope.getByText('ONLINE CBT EXAMINATION',{exact:true}).count(),0,'Redundant overview must be absent');
              assert.equal(await scope.getByRole('group',{name:'Select test language'}).count(),0,'Language control is exam-only');
              assert.equal(await scope.getByRole('button',{name:'CBT Mode',exact:true}).count(),0,'CBT controls are exam-only');
              await scope.getByText('14 tests',{exact:true}).waitFor();
              const search = scope.getByRole('textbox',{name:'Search tests',exact:true});
              const classFilter = scope.getByRole('combobox',{name:'Filter by class',exact:true});
              assert.equal(await classFilter.inputValue(),'all');
              assert.equal(await scope.getByRole('heading',{name:/^Fixture test /}).count(),12);
              await scope.getByRole('button',{name:'Next',exact:true}).click();
              await scope.getByRole('heading',{name:'Fixture test 13',exact:true}).waitFor();
              await classFilter.selectOption('10');
              await scope.getByText('1 tests',{exact:true}).waitFor();
              await scope.getByRole('combobox',{name:'Filter by subject'}).selectOption('Geography');
              await scope.getByRole('combobox',{name:'Filter by chapter'}).selectOption('Resources');
              await scope.getByRole('heading',{name:'Fixture test 13',exact:true}).waitFor();
              await search.fill('NO_MATCH_FIXTURE');
              await scope.getByRole('heading',{name:'No matching tests'}).waitFor();
              await scope.getByRole('button',{name:'Clear filters',exact:true}).first().click();
              await scope.getByText('14 tests',{exact:true}).waitFor();
              failCatalogue = true;
              await scope.getByRole('button',{name:'Refresh',exact:true}).click();
              await scope.getByRole('button',{name:'Retry',exact:true}).waitFor();
              failCatalogue = false;
              await scope.getByRole('button',{name:'Retry',exact:true}).click();
              await scope.getByText('14 tests',{exact:true}).waitFor();
              await page.goto(base + '/online-tests/?class=10');
              await scope.getByText('1 tests',{exact:true}).waitFor();
              assert.equal(await classFilter.inputValue(),'10');
              await scope.getByText('Test instructions',{exact:true}).click();
              await scope.getByText('Read each question carefully.',{exact:true}).waitFor();
              const card = scope.getByRole('button',{name:'Fixture test 13 — Start test',exact:true});
              assert.equal(await card.count(),1,'Exactly one start action per card');
              assert.equal(await scope.getByRole('button',{name:'Login to start',exact:true}).count(),0);
              await card.getByRole('heading',{name:'Fixture test 13',exact:true}).click();
              const login = page.getByRole('dialog',{name:'Student account'});
              await login.waitFor();
              assert.equal(starts,0,'Guest must not start a server attempt');
              await login.getByRole('button',{name:'Close',exact:true}).click();
              await login.waitFor({state:'hidden'});
              assert.equal(starts,0,'Cancelling login must not start an attempt');
              await card.click();
              await login.waitFor();
              assert.equal(starts,0,'Reopening login must not start an attempt');
              await context.close();
              console.log('PASS public catalogue at viewport '+width);
            }
            // Student sessions and server responses below are synthetic; no live API is used.
            for (const flow of ['already-signed-in','guest-login']) {
              const context = await browser.newContext({viewport:{width:390,height:900},serviceWorkers:'block'});
              const owner = '00000000-0000-4000-8000-000000000010';
              const profile = {user_id:owner,student_name:'Fixture Student',class_level:'10',roll_no:'10',school_name:'Fixture School',country:'India',state:'Fixture',district:'Fixture',area_type:'city',locality_name:'Fixture',pin_code:'000000',approval_status:'approved',account_status:'active',deleted_at:null};
              const jwt = ['eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9',Buffer.from(JSON.stringify({sub:owner,exp:Math.floor(Date.now()/1000)+3600,role:'authenticated'})).toString('base64url'),'fixture-signature'].join('.');
              const session = {access_token:jwt,refresh_token:'fixture-refresh',token_type:'bearer',expires_in:3600,expires_at:Math.floor(Date.now()/1000)+3600,user:{id:owner,aud:'authenticated',role:'authenticated',email:'fixture@example.invalid',app_metadata:{},user_metadata:{account_type:'student'},created_at:new Date().toISOString()}};
              const starts = [];
              await context.addInitScript(({flow,owner,session}) => {
                localStorage.setItem('krishan_portal_lang','en');
                if (flow === 'already-signed-in') {
                  localStorage.setItem('sb-catalogue-fixture-auth-token',JSON.stringify(session));
                  sessionStorage.setItem('krishansir.student-tab-session.v1',owner);
                }
              },{flow,owner,session});
              await context.route('**/*',async route => {
                const url = new URL(route.request().url());
                if (url.origin === base) return route.continue();
                if (url.hostname !== 'catalogue-fixture.invalid') return route.abort();
                const headers = {'access-control-allow-origin':'*','access-control-allow-headers':'*','access-control-allow-methods':'GET,POST,OPTIONS','content-type':'application/json'};
                const send = value => route.fulfill({status:200,headers,body:JSON.stringify(value)});
                if (route.request().method() === 'OPTIONS') return route.fulfill({status:204,headers});
                if (url.pathname === '/auth/v1/token') return send(session);
                if (url.pathname === '/auth/v1/user') return send(session.user);
                if (url.pathname === '/rest/v1/student_profiles') return send(profile);
                if (url.pathname === '/rest/v1/user_roles') return send(null);
                if (url.pathname === '/rest/v1/tests') return send(fixtures);
                if (url.pathname === '/rest/v1/test_attempts') return send([]);
                if (url.pathname.endsWith('/rpc/start_test_attempt')) {
                  const body = route.request().postDataJSON();
                  starts.push(body.p_test_id);
                  return send({id:'fixture-attempt',student_id:owner,test_id:body.p_test_id,attempt_number:1,status:'in_progress',started_at:new Date().toISOString(),expires_at:new Date(Date.now()+1800000).toISOString(),submitted_at:null,score:null,total_marks:null,percentage:null,correct_count:null,attempted_count:null});
                }
                return send([]);
              });
              const page = await context.newPage();
              await page.goto(base+'/online-tests/?class=10');
              const card = page.getByRole('button',{name:'Fixture test 13 — Start test',exact:true});
              await card.waitFor();
              if (flow === 'already-signed-in') {
                await page.getByRole('button',{name:/My Class/}).waitFor();
              }
              await card.click();
              if (flow === 'guest-login') {
                const login = page.getByRole('dialog',{name:'Student account'});
                await login.waitFor();
                await login.getByPlaceholder('Enter mobile number or email').fill('fixture@example.invalid');
                await login.getByPlaceholder('Enter your password').fill('Fixture123');
                await login.locator('form').evaluate(form=>form.requestSubmit());
                await login.waitFor({state:'hidden'});
              }
              await page.locator('#cbt-test-workspace').waitFor({state:'visible',timeout:20000});
              await page.getByRole('group',{name:'Select test language'}).waitFor();
              await page.getByRole('button',{name:'CBT Mode',exact:true}).waitFor();
              await page.getByRole('button',{name:'All Questions',exact:true}).waitFor();
              await page.locator('#tests').getByText('Fixture Student',{exact:true}).filter({visible:true}).waitFor();
              assert.deepEqual(starts,['fixture-13'],'The exact selected test starts once');
              assert.equal(await page.getByRole('dialog',{name:'Student account'}).count(),0);
              await context.close();
              console.log('PASS direct start: '+flow);
            }
          } finally { await browser.close(); }
          JS
          node .catalogue-smoke.mjs
