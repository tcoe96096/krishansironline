name: Teacher Management v2 draft checks (no activation or deployment)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher-draft-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pglast==8.8
      - name: Parse proposals without executing SQL
        run: python scripts/parse-teacher-sql.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Private resume negative tests with mocked APIs
        run: deno test --node-modules-dir=auto --allow-env supabase/functions/teacher-resume/index.test.ts
      - run: npm install --no-save --legacy-peer-deps playwright
      - run: npx playwright install --with-deps chromium
      - name: Start isolated mock-contract website
        env:
          VITE_SUPABASE_URL: https://teacher-test.supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-key
          VITE_TEACHER_BETA_ENABLED: 'true'
          VITE_TEACHER_ADVANCED_ENABLED: 'false'
          VITE_TEACHER_RESULT_ANALYTICS_ENABLED: 'false'
          VITE_TEACHER_RESUME_ENABLED: 'false'
        run: |
          npm run dev -- --port 4174 --host 127.0.0.1 > /tmp/teacher-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node scripts/teacher-management-smoke.mjs
        env:
          TEACHER_TEST_RESUME_ENABLED: 'false'
      - name: Verify target guards and data-preserving artifact assembly (no SQL/network)
        run: python3 scripts/test_teacher_beta_guardrails.py
      - name: Build isolated core-only Teacher Beta artifact (no publish)
        env:
          VITE_SUPABASE_URL: https://teacher-test.supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: test-key
          VITE_TEACHER_BETA_ENABLED: 'true'
          VITE_TEACHER_ADVANCED_ENABLED: 'false'
          VITE_TEACHER_RESULT_ANALYTICS_ENABLED: 'false'
          VITE_TEACHER_RESUME_ENABLED: 'false'
        run: npm run build:teacher-beta
      - name: Start local core-only artifact
        run: |
          npm run preview:teacher-beta -- --port 4177 --host 127.0.0.1 > /tmp/teacher-core-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4177/teacher-beta/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test core-only profile and authorization UI with mocked APIs
        env:
          TEACHER_TEST_BASE_URL: http://127.0.0.1:4177/teacher-beta
          TEACHER_TEST_PORTAL: 'true'
        run: node scripts/teacher-management-smoke.mjs
