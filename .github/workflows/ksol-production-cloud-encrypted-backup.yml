name: KSOL Production encrypted database backup
on:
  schedule:
    # Sunday 02:37 IST (Saturday 21:07 UTC); opt-in only.
    - cron: '7 21 * * 6'
  workflow_dispatch:
    inputs:
      acknowledgment:
        description: 'Type BACKUP_PRODUCTION_READ_ONLY'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ksol-private-production-cloud-backup
  cancel-in-progress: false
jobs:
  production-encrypted-backup:
    # Manual acknowledgment or separate scheduled-backup opt-in; never PR runs.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'tcoe96096/krishansironline' &&
      github.event.repository.private == false &&
      vars.KSOL_PRODUCTION_BACKUP_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.acknowledgment == 'BACKUP_PRODUCTION_READ_ONLY') ||
       (github.event_name == 'schedule' &&
        vars.KSOL_PRODUCTION_AUTO_BACKUP_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KSOL_DB_HOST: ${{ secrets.KSOL_PRODUCTION_DB_HOST }}
      KSOL_DB_PORT: ${{ secrets.KSOL_PRODUCTION_DB_PORT }}
      KSOL_DB_USER: ${{ secrets.KSOL_PRODUCTION_DB_USER }}
      KSOL_DB_NAME: ${{ secrets.KSOL_PRODUCTION_DB_NAME }}
      KSOL_DB_PASSWORD: ${{ secrets.KSOL_PRODUCTION_DB_PASSWORD }}
      RCLONE_CONFIG_B64: ${{ secrets.KSOL_RCLONE_CONFIG_B64 }}
      RCLONE_CONFIG_PASS: ${{ secrets.KSOL_RCLONE_CONFIG_PASSWORD }}
    steps:
      - name: Retrieve only the reviewed source (no PR-origin code)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22 for safe binary stream transport
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free, public PostgreSQL 18 and rclone tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg postgresql-common rclone
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/postgres.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/postgres.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Encrypted-stream Production dump with cloud readback (never saves raw archive)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RCLONE_CONFIG_B64"
          test -n "$KSOL_DB_PASSWORD"
          test -n "$KSOL_DB_HOST"
          test -n "$KSOL_DB_USER"
          test -n "$KSOL_DB_NAME"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          export RCLONE_CONFIG="$RUNNER_TEMP/ksol-private-rclone.conf"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RCLONE_CONFIG"
          unset RCLONE_CONFIG_B64
          chmod 600 "$RCLONE_CONFIG"
          # Scheduled runs fail closed unless Drive reports sufficient free space.
          # No automatic deletion; keep existing verified recovery copies.
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            rclone about ksolcrypt: --json 2>/dev/null | node -e 'let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{try{const d=JSON.parse(s); if(!Number.isSafeInteger(d.free)||d.free<1073741824) process.exitCode=2;}catch{process.exitCode=2;}});'
            rclone size ksolcrypt:production/ --json 2>/dev/null | node -e 'let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{try{const d=JSON.parse(s); if(!Number.isSafeInteger(d.bytes)||d.bytes<0||d.bytes>=1073741824) process.exitCode=2;}catch{process.exitCode=2;}});'
            echo 'Scheduled backup free-space and namespace preflight passed.'
          fi
          node scripts/recovery/cloud-stream-backup.mjs --source production
          echo 'Production encrypted database archive readback succeeded; Auth runtime, Storage file bytes and full recovery remain NOT VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
