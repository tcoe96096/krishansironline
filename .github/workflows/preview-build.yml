name: Preview build (no production deploy)

on:
  push:
    branches:
      - "feature/student-auth-test-system"
      - "feature/student-mobile-password-auth"
      - "preview/student-system-live-design-integration"
  pull_request:
    branches:
      - "feature/student-auth-test-system"
      - "preview/student-system-live-design-integration"
      - "main"

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-build:
    name: Build preview artifact only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Build Vite preview
        run: npm run build

      - name: Verify generated website pages
        run: |
          test -f dist/classes/index.html
          test -f dist/online-tests/index.html
          test -f dist/study-materials/index.html
          test -f dist/results/index.html
          test -f dist/constitution/index.html
          test -f dist/current-affairs/index.html
          test -f dist/about/index.html
          test -f dist/contact/index.html

      - name: Upload preview files (no publish)
        uses: actions/upload-artifact@v4
        with:
          name: krishansir-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
