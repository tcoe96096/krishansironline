name: KSOL Production Storage archive verification (manual only)
on:
  workflow_dispatch:
    inputs:
      acknowledgment:
        description: 'Type VERIFY_PRODUCTION_STORAGE_ARCHIVE_ONLY'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ksol-private-production-cloud-backup
  cancel-in-progress: false
jobs:
  verify-storage-archive:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'tcoe96096/krishansironline' &&
      vars.KSOL_PRODUCTION_STORAGE_BACKUP_ENABLED == 'true' &&
      inputs.acknowledgment == 'VERIFY_PRODUCTION_STORAGE_ARCHIVE_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Independently verify encrypted Storage archive
        env:
          RCLONE_CONFIG_B64: ${{ secrets.KSOL_RCLONE_CONFIG_B64 }}
          RCLONE_CONFIG_PASS: ${{ secrets.KSOL_RCLONE_CONFIG_PASSWORD }}
          KSOL_STORAGE_VERIFY_ACK: ${{ inputs.acknowledgment }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RCLONE_CONFIG_B64"
          export RCLONE_CONFIG="$RUNNER_TEMP/ksol-private-rclone.conf"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$RCLONE_CONFIG"
          unset RCLONE_CONFIG_B64
          chmod 600 "$RCLONE_CONFIG"
          node scripts/recovery/verify-production-storage-archive.mjs
          echo 'Storage archive integrity verified independently. Storage service restore and full recovery remain NOT VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
