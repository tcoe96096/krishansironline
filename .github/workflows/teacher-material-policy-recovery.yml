name: Local Teacher Material policy and recovery rehearsal
# Manual only. Do not dispatch while the owner's no-SQL hold is in effect.
on:
  workflow_dispatch:
    inputs:
      allow_local_sql_rehearsal:
        description: Separately authorized LOCAL PostgreSQL rehearsal only
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  isolated-local-policy-rehearsal:
    if: ${{ inputs.allow_local_sql_rehearsal == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test local PostgreSQL RLS, atomic abort, policy recovery and synthetic backup restore
        run: python3 scripts/review-teacher-material-policies.py
      - name: Upload synthetic verification evidence only
        uses: actions/upload-artifact@v4
        with:
          name: teacher-policy-recovery-${{ github.sha }}
          path: |
            work/policy-review/results.json
            work/policy-review/policy-only-rollback.sql
          retention-days: 14
