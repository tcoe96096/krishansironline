name: Study Materials synthetic security (review only)

on:
  push:
    branches:
      - test/study-video-url-mock-20261121
    paths:
      - 'tests/studyMaterialsVideoEmbedMock.test.ts'
      - 'tests/studyMaterialsDownloadExpiryMock.test.ts'
      - 'tests/studyMaterialsMockAccess.test.ts'
      - '.github/workflows/study-materials-synthetic-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-security:
    name: Synthetic security tests (no backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated synthetic tests
        run: npx --no-install tsx --test tests/studyMaterialsVideoEmbedMock.test.ts tests/studyMaterialsDownloadExpiryMock.test.ts tests/studyMaterialsMockAccess.test.ts
