name: Private result publication isolated PostgreSQL contract
on:
  pull_request:
    paths:
      - 'docs/results/result-private-publication-20261127-CANDIDATE-DO-NOT-APPLY.sql'
      - 'docs/results/result-generation-snapshot-20261127-CANDIDATE-DO-NOT-APPLY.sql'
      - 'tests/fixtures/result-private-publication-disposable-postgres.sql'
      - 'tests/fixtures/result-template-disposable-postgres.sql'
      - 'docs/results/result-template-production-CANDIDATE-DO-NOT-APPLY.sql'
      - 'scripts/results/package-result-sql-20261128.mjs'
      - '.github/workflows/result-private-publication-disposable-postgres.yml'
permissions:
  contents: read
jobs:
  disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: template_test
        options: >-
          --health-cmd "pg_isready -U postgres -d template_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute atomic combined result SQL on disposable PostgreSQL
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          node scripts/results/package-result-sql-20261128.mjs /tmp/result-atomic-package.sql
          python3 - <<'PY'
          from pathlib import Path
          fixture = Path('tests/fixtures/result-private-publication-disposable-postgres.sql').read_text()
          template = Path('tests/fixtures/result-template-disposable-postgres.sql').read_text()
          generation = r'\i docs/results/result-generation-snapshot-20261127-CANDIDATE-DO-NOT-APPLY.sql'
          publication = r'\i docs/results/result-private-publication-20261127-CANDIDATE-DO-NOT-APPLY.sql'
          style = r'\i docs/results/result-template-production-CANDIDATE-DO-NOT-APPLY.sql'
          assert fixture.count(generation)==fixture.count(publication)==template.count(style)==1
          setup = template[template.index('CREATE TABLE auth.users'):template.index('CREATE FUNCTION auth.uid')]
          bundle = Path('/tmp/result-atomic-package.sql').read_text()
          combined = fixture.replace(generation, setup+'\n'+bundle).replace(publication,'')
          combined += '\nRESET ROLE;\n'+template.split(style,1)[1]
          combined += "\nSELECT 'RESULT_ATOMIC_PACKAGE_SYNTHETIC_ASSERTIONS_PASSED' AS status;\n"
          Path('/tmp/result-private-publication-synthetic.sql').write_text(combined)
          PY
          docker exec -i "$CONTAINER" psql -X -U postgres -d template_test -v ON_ERROR_STOP=1 < /tmp/result-private-publication-synthetic.sql
