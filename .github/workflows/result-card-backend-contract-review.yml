name: Result Card Backend Review Contract
on:
  push:
    branches:
      - docs/result-card-backend-review-20261122
    paths:
      - 'tests/resultCardBackendContractReview.test.mjs'
      - 'tests/resultCardAtomicSqlStaticReview.test.mjs'
      - 'tests/resultCardStudentAccessSqlStaticReview.test.mjs'
      - 'docs/results/ksol-result-student-access-gate-CANDIDATE-DO-NOT-APPLY.sql'
      - 'docs/results/ksol-result-atomic-transition-executable-CANDIDATE-DO-NOT-APPLY.sql'
      - '.github/workflows/result-card-backend-contract-review.yml'
  pull_request:
    paths:
      - 'tests/resultCardBackendContractReview.test.mjs'
      - 'tests/resultCardAtomicSqlStaticReview.test.mjs'
      - 'tests/resultCardStudentAccessSqlStaticReview.test.mjs'
      - 'docs/results/ksol-result-student-access-gate-CANDIDATE-DO-NOT-APPLY.sql'
      - 'docs/results/ksol-result-atomic-transition-executable-CANDIDATE-DO-NOT-APPLY.sql'
      - '.github/workflows/result-card-backend-contract-review.yml'
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic fail-closed contract checks
        run: node --test tests/resultCardBackendContractReview.test.mjs tests/resultCardAtomicSqlStaticReview.test.mjs tests/resultCardStudentAccessSqlStaticReview.test.mjs
