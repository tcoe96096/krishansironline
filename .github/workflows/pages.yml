name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite website
        run: npm run build

      - name: Build isolated, inactive Teacher portal
        env:
          # This static site is only a visual preview; no operational Teacher RPCs.
          # NEVER point this step at Production Supabase until RLS/UAT is accepted.
          VITE_SUPABASE_URL: https://teacher-disabled.supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: disabled-preview-only
          VITE_TEACHER_BETA_ENABLED: 'false'
          VITE_TEACHER_ADVANCED_ENABLED: 'false'
          VITE_TEACHER_RESULT_ANALYTICS_ENABLED: 'false'
          VITE_TEACHER_RESUME_ENABLED: 'false'
          VITE_TEACHER_PHOTO_ENABLED: 'false'
        run: |
          npx vite build --config vite.teacher-beta.config.ts --base=/teacher-beta/
          test ! -e dist/teacher-beta
          mkdir -p dist/teacher-beta
          cp -a teacher-beta-dist/. dist/teacher-beta/
          for route in index.html registration/index.html login/index.html dashboard/index.html admin/index.html staff-workspace/index.html; do
            test -s "dist/teacher-beta/$route"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
