name: KSOL disposable restore harness synthetic smoke
on:
  pull_request:
    paths:
      - 'scripts/recovery/restore-archive-to-disposable-postgres.sh'
      - '.github/workflows/ksol-disposable-restore-harness-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify missing acknowledgement fails closed
        shell: bash
        run: |
          if printf 'invalid' | bash scripts/recovery/restore-archive-to-disposable-postgres.sh; then
            echo 'FAIL: missing acknowledgement accepted'
            exit 1
          fi
      - name: Build disposable synthetic PostgreSQL archive
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ksol-synthetic-source --network none -e POSTGRES_PASSWORD=synthetic_only -e POSTGRES_DB=synthetic postgres:17-alpine >/dev/null
          trap 'docker rm -f ksol-synthetic-source >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if docker exec ksol-synthetic-source psql -X -U postgres -d synthetic -Atqc "SELECT 1" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec ksol-synthetic-source psql -X -U postgres -d synthetic -v ON_ERROR_STOP=1 -c 'CREATE TABLE synthetic_restore_check (id integer PRIMARY KEY); INSERT INTO synthetic_restore_check VALUES (1), (2);' >/dev/null
          docker exec ksol-synthetic-source pg_dump -U postgres -d synthetic --format=custom | KSOL_DISPOSABLE_RESTORE_ACK=I_UNDERSTAND_ISOLATED_ONLY bash scripts/recovery/restore-archive-to-disposable-postgres.sh
      # This tests the expected schema gate, not the entire Supabase platform.
      - name: Verify Supabase-shaped synthetic archive restores the required catalog
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ksol-schema-positive --network none -e POSTGRES_PASSWORD=synthetic_only -e POSTGRES_DB=synthetic postgres:17-alpine >/dev/null
          trap 'docker rm -f ksol-schema-positive >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if docker exec ksol-schema-positive psql -X -U postgres -d synthetic -Atqc "SELECT 1" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec ksol-schema-positive psql -X -U postgres -d synthetic -v ON_ERROR_STOP=1             -c 'CREATE SCHEMA auth; CREATE SCHEMA storage; CREATE TABLE auth.users (id integer PRIMARY KEY); CREATE TABLE storage.objects (id integer PRIMARY KEY); CREATE TABLE public.student_profiles (id integer PRIMARY KEY); CREATE TABLE public.test_attempts (id integer PRIMARY KEY); CREATE TABLE public.synthetic_auth_fk (id integer PRIMARY KEY, owner_id integer REFERENCES auth.users(id)); INSERT INTO auth.users VALUES (42); INSERT INTO public.student_profiles VALUES (1); INSERT INTO public.test_attempts VALUES (1); INSERT INTO public.synthetic_auth_fk VALUES (1,42); CREATE TABLE public.tests (id integer PRIMARY KEY); CREATE TABLE public.test_answer_keys (test_id integer PRIMARY KEY REFERENCES public.tests(id)); ALTER TABLE public.test_attempts ADD COLUMN test_id integer REFERENCES public.tests(id); ALTER TABLE public.student_profiles ENABLE ROW LEVEL SECURITY; ALTER TABLE public.tests ENABLE ROW LEVEL SECURITY; ALTER TABLE public.test_answer_keys ENABLE ROW LEVEL SECURITY; ALTER TABLE public.test_attempts ENABLE ROW LEVEL SECURITY; CREATE POLICY fixture_profile ON public.student_profiles FOR SELECT USING (true); CREATE POLICY fixture_attempt ON public.test_attempts FOR SELECT USING (true); CREATE FUNCTION public.start_test_attempt(text) RETURNS integer LANGUAGE sql RETURN 1; CREATE FUNCTION public.submit_test_attempt(uuid,jsonb) RETURNS integer LANGUAGE sql RETURN 1;' >/dev/null
          docker exec ksol-schema-positive pg_dump -U postgres -d synthetic --format=custom |
            KSOL_DISPOSABLE_RESTORE_ACK=I_UNDERSTAND_ISOLATED_ONLY KSOL_EXPECT_SUPABASE_SCHEMA=1 KSOL_VERIFY_EXAM_CATALOG=1 bash scripts/recovery/restore-archive-to-disposable-postgres.sh
          # Application-only recovery must work without claiming platform recovery.
          # Referenced auth.users row is absent in destination on purpose.
          # A data-salvage proof must not pretend that the FK is validated.
          docker exec ksol-schema-positive pg_dump -U postgres -d synthetic --format=custom |
            KSOL_DISPOSABLE_RESTORE_ACK=I_UNDERSTAND_ISOLATED_ONLY KSOL_RESTORE_VERIFY_SCOPE=application bash scripts/recovery/restore-archive-to-disposable-postgres.sh |
            grep -F 'KSOL_APPLICATION_DATA_READABLE=YES'
      - name: Verify required Supabase table check rejects incomplete synthetic backup
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ksol-schema-negative --network none -e POSTGRES_PASSWORD=synthetic_only -e POSTGRES_DB=synthetic postgres:17-alpine >/dev/null
          trap 'docker rm -f ksol-schema-negative >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if docker exec ksol-schema-negative psql -X -U postgres -d synthetic -Atqc "SELECT 1" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec ksol-schema-negative psql -X -U postgres -d synthetic -v ON_ERROR_STOP=1 -c 'CREATE TABLE synthetic_restore_check (id integer PRIMARY KEY);' >/dev/null
          if docker exec ksol-schema-negative pg_dump -U postgres -d synthetic --format=custom | KSOL_DISPOSABLE_RESTORE_ACK=I_UNDERSTAND_ISOLATED_ONLY KSOL_EXPECT_SUPABASE_SCHEMA=1 bash scripts/recovery/restore-archive-to-disposable-postgres.sh; then
            echo 'FAIL: incomplete synthetic schema was accepted'
            exit 1
          fi
          echo 'Missing required Supabase tables correctly rejected'
      - name: Verify extension diagnosis allowlist never prints arbitrary identifiers
        shell: bash
        run: |
          set -euo pipefail
          # The classifier is intentionally inline in the restore script, with
          # the failed TOC identifier validated against fixed extension names.
          grep -Fq 'RESTORE_FAILED_KNOWN_EXTENSION:' scripts/recovery/restore-archive-to-disposable-postgres.sh
          grep -Fq 'RESTORE_EXTENSION_FAILURE_SCOPE:' scripts/recovery/restore-archive-to-disposable-postgres.sh
          grep -Fq 'SERVER_PRELOAD_CONFIGURATION' scripts/recovery/restore-archive-to-disposable-postgres.sh
          grep -Fq 'FIXED_DATABASE_REQUIREMENT' scripts/recovery/restore-archive-to-disposable-postgres.sh
      - name: Confirm no leftover restore container
        shell: bash
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^ksol-disposable-restore-'; then
            echo 'FAIL: disposable restore container not cleaned'
            exit 1
          fi
          echo 'Disposable restore container cleanup confirmed'
